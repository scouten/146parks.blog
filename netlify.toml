[build]
publish = "public"
command = "zola build" # -- restore when back to published version
# command = "curl -sL https://github.com/scouten/zola/releases/download/v0.16.1.es1/zola.tar.gz | tar zxv && chmod +x ./zola && ./zola build"


[build.environment]
ZOLA_VERSION = "0.19.2" # -- restore when back to published version

# The magic for deploying previews of branches.
# We need to override the base url with whatever url Netlify assigns to our
# preview site.  We do this using the Netlify environment variable
# `$DEPLOY_PRIME_URL`.

[context.deploy-preview]
# Previews also proxy the track JSON through their own origin: the CDN's CORS rule
# lists exact origins, and Tigris does not match *.netlify.app. The theme retries
# /track/... on the page origin when the direct fetch is refused. Production does not proxy.
command = "zola build --base-url $DEPLOY_PRIME_URL && printf '/track/* https://img.ericscouten.com/track/:splat 200\\n' >> public/_redirects" # -- restore when back to published version
# command = "curl -sL https://github.com/scouten/zola/releases/download/v0.16.1.es1/zola.tar.gz | tar zxv && chmod +x ./zola && ./zola build --base-url $DEPLOY_PRIME_URL"

# The parks map and to-do map pages gave way to the home page's Washington map.
[[redirects]]
  from = "/map/*"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/todo/*"
  to = "/"
  status = 301
  force = true

# Using 302 (temporary) redirects because I might someday
# want to have a separate welcome page. We'll see.

[[redirects]]
  from = "/parks/index.html"
  to = "/"
  status = 302
  force = true

[[redirects]]
  from = "/parks/*"
  to = "/:splat"
  status = 302
  force = true
